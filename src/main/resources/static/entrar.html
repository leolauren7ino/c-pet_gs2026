<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | C-PET</title>
  <meta name="description" content="Acesso da central de triagem e dos recursos parceiros.">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/cidadao.css">
</head>
<body>
  <div id="cabecalho"></div>
  <main class="pagina">
    <h1>Entrar como</h1>
    <p class="suave mt-2" style="max-width:58ch">Acesso para a central de triagem e para os recursos parceiros. Nesta demonstração não há senha: escolha um perfil para continuar.</p>
    <div class="alerta-erro mt-3" id="erro" role="alert" hidden></div>
    <div class="usuarios" id="usuarios"></div>
    <section class="mt-5" style="max-width:58ch">
      <h2 class="mb-2">Refazer a demonstração</h2>
      <p class="suave mb-3">Apaga o que foi criado e recarrega os casos simulados, para gravar de novo a partir do zero.</p>
      <button class="btn-c sec" type="button" id="reset">Reiniciar dados simulados</button>
      <p class="mt-2" id="reset-msg" role="status"></p>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/entrar.js"></script>
</body>
</html>
